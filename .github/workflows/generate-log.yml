name: Generate tmpLog.md

"on":
  workflow_dispatch:
    inputs:
      summary_date:
        description: "指定提交日 YYYY-MM-DD(留空 = 用 Sheet 最新一列;區間自動 = 上一列+1天 ~ 這一列)"
        required: false
        default: ""
      annotated:
        description: "有手寫註記的檔名 JSON 陣列(選用,來自看圖步驟),例 [\"IMG_5102.jpeg\"]"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (EXIF)
        run: pip install Pillow pillow-heif

      - name: Generate tmpLog.md
        env:
          SUMMARY_DATE: ${{ github.event.inputs.summary_date }}
          ANNOTATED_JSON: ${{ github.event.inputs.annotated }}
          # 可覆寫:OWNER / REPO / BRANCH / SHEET_ID / GID / FALLBACK_DAYS
        run: python scripts/generate_log.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有變更,略過 commit"
          else
            git commit -m "chore: 更新 tmpLog.md (${{ github.event.inputs.summary_date }})"
            git push
          fi
